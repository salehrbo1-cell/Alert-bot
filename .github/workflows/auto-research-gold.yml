name: AutoResearch Gold - hourly discovery + Telegram daily
on:
  workflow_dispatch:
  push:
    paths:
      - "research/auto_research_gold.py"
      - "research/ai_hypothesis_agent.py"
      - "research/open_discovery_gold.py"
      - "research/notify_research_telegram.py"
      - ".github/workflows/auto-research-gold.yml"
  schedule:
    - cron: "30 * * * *" # Every hour; daily Telegram digest around 06:30 Saudi
permissions:
  contents: write
concurrency:
  group: auto-research-gold-daily
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Python researcher
        run: |
          python -m py_compile research/auto_research_gold.py research/ai_hypothesis_agent.py research/open_discovery_gold.py research/notify_research_telegram.py
      - name: Set daily market-data cache key
        id: cache-date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore or save daily market-data cache
        id: market-cache
        uses: actions/cache@v4
        with:
          path: /tmp/xau_autoresearch_m1.csv
          key: xauusd-m1-bid-260d-${{ runner.os }}-${{ steps.cache-date.outputs.today }}-v1
      - name: Download 260 days of historical XAUUSD M1 BID
        if: steps.market-cache.outputs.cache-hit != 'true'
        run: |
          START=$(date -u -d '260 days ago' +%F)
          END=$(date -u -d 'tomorrow' +%F)
          echo "Dukascopy historical range: $START through $END"
          npx -y dukascopy-node -i xauusd -from "$START" -to "$END" -t m1 -f csv -p bid
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path("download").rglob("*.csv"))
          if not files: raise SystemExit("Dukascopy returned no M1 CSV; no results will be committed")
          source=max(files,key=lambda x:x.stat().st_size)
          print("Input:",source,source.stat().st_size)
          if source.stat().st_size<100_000:raise SystemExit("Downloaded source is unexpectedly small")
          shutil.copyfile(source,"/tmp/xau_autoresearch_m1.csv")
          PY
      - name: Evaluate 432 strategy combinations on M5 and M15
        run: |
          python research/auto_research_gold.py /tmp/xau_autoresearch_m1.csv research/auto_research
          mkdir -p research/auto_research/history
          cp research/auto_research/latest.json "research/auto_research/history/$(date -u +%F).json"
      - name: Check Gemini secret presence without printing its value
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Gemini API key is configured for AI hypothesis generation"
          else
            echo "Gemini API key is absent; using free offline evolution only"
          fi
      - name: Discover market patterns without legacy trading rules (optional Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research/open_discovery_gold.py /tmp/xau_autoresearch_m1.csv research/open_discovery
      - name: Upload detailed results as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-autoresearch-results
          path: |
            research/auto_research/latest.json
            research/auto_research/all_variants.csv
            research/auto_research/README.md
            research/open_discovery/latest.json
            research/open_discovery/README.md
          retention-days: 30
      - name: Send daily research digest to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SEND_TEST: "false"
        run: |
          python research/notify_research_telegram.py
      - name: Save results to GitHub without modifying production bot
        run: |
          git config user.name "research-data-bot"
          git config user.email "research-data-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add research/auto_research/ research/open_discovery/
            if git diff --cached --quiet; then echo "No new results"; exit 0; fi
            git commit -m "AutoResearch gold: save daily backtest results"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Could not push results after retries"
          exit 1
