name: Research V3 six-month IFVG limit versus market
on:
  push:
    paths:
      - ".github/workflows/study-sweep-poi-ifvg-cisd-v3.yml"
      - "research/study_sweep_poi_ifvg_cisd_v3.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xau-four-stage-v3
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download 6+ months M1 BID gold with HTF warmup
        run: |
          npx -y dukascopy-node -i xauusd -from 2026-04-01 -to 2026-11-18 -t m1 -f csv -p bid
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path("download").rglob("*.csv"))
          if not files:raise SystemExit("Dukascopy M1 CSV missing")
          source=max(files,key=lambda p:p.stat().st_size)
          print("Source",source,"bytes",source.stat().st_size)
          shutil.copyfile(source,"/tmp/gold_m1.csv")
          PY
      - name: Backtest V3 and save all per-trade R values
        run: |
          python -m py_compile research/study_sweep_poi_ifvg_cisd_v3.py
          python research/study_sweep_poi_ifvg_cisd_v3.py /tmp/gold_m1.csv research/results_sweep_poi_ifvg_cisd_v3
      - name: Commit backtest outputs
        run: |
          git config user.name "research-data-bot"
          git config user.email "research-data-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add research/results_sweep_poi_ifvg_cisd_v3/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save 6-month IFVG limit retest 2R London NY research"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
