name: Research confirmed wick at historical resistance and monthly close
on:
  push:
    paths:
      - ".github/workflows/study-wick-limit-revisit.yml"
      - "research/study_wick_limit_revisit.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-wick-limit-revisit
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download historical XAUUSD BID minute data
        run: |
          npx -y dukascopy-node -i xauusd -from 2025-08-01 -to 2026-11-18 -t m1 -f csv -p bid
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path("download").rglob("*.csv"))
          if not files: raise SystemExit("Missing data")
          p=max(files,key=lambda x:x.stat().st_size)
          print(p,p.stat().st_size)
          shutil.copyfile(p,"/tmp/xau_wick_limit_m1.csv")
          PY
      - name: Backtest body-edge limit entry, excursion and first revisit
        run: |
          python -m py_compile research/study_wick_limit_revisit.py
          python research/study_wick_limit_revisit.py /tmp/xau_wick_limit_m1.csv research/results_wick_limit_revisit
      - name: Save research output
        run: |
          git config user.name "research-data-bot"
          git config user.email "research-data-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add research/results_wick_limit_revisit/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save confirmed historical-resistance wick excursion results"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
