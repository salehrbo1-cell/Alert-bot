name: Samo paper-monitor study
on:
  push:
    paths:
      - "research/sonic_pattern_paper.py"
      - ".github/workflows/samo-paper.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: samo-paper-monitor
  cancel-in-progress: false
jobs:
  paper-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest branch state before sampling
        run: git pull --rebase origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m py_compile research/sonic_pattern_paper.py
      - name: Track Sweep, IFVG, CISD and paper exits
        run: python research/sonic_pattern_paper.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      - name: Save paper observations
        run: |
          git config user.name "samo-paper-monitor"
          git config user.email "samo-paper-monitor@users.noreply.github.com"
          git add research/sonic_paper/state.json research/sonic_paper/trades.csv research/sonic_paper/minute_path.csv research/sonic_paper/exit_rule_tp20_sl5.csv research/sonic_paper/exit_rule_structure_break.csv research/sonic_paper/exit_rule_m5_structure.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Samo paper-monitor observations"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
