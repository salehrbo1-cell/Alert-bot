name: bitcoin-signal-alert
on:
  schedule:
    # Scan shortly after each closed M15 candle (UTC).
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bitcoin-signal-alert
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m py_compile btc_alert.py
      - run: python btc_alert.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BTC_SLIPPAGE_USD_PER_SIDE: ${{ vars.BTC_SLIPPAGE_USD_PER_SIDE || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - run: |
          git config user.name "bitcoin-alert-bot"
          git config user.email "bitcoin-alert-bot@users.noreply.github.com"
          git add btc_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Bitcoin bot state"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
