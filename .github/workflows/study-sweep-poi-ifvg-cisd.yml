name: Research HTF Sweep POI IFVG CISD on gold
on:
  push:
    paths:
      - ".github/workflows/study-sweep-poi-ifvg-cisd.yml"
      - "research/study_sweep_poi_ifvg_cisd.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xau-four-stage-research
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download M1 XAUUSD BID with warmup
        run: |
          npx -y dukascopy-node -i xauusd -from 2026-09-01 -to 2026-11-18 -t m1 -f csv -p bid
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path("download").rglob("*.csv"))
          if not files:raise SystemExit("Dukascopy M1 CSV missing")
          source=max(files,key=lambda p:p.stat().st_size)
          print("Using",source,"bytes",source.stat().st_size)
          shutil.copyfile(source,"/tmp/gold_m1.csv")
          PY
      - name: Run four-stage strict sequential backtest
        run: |
          python -m py_compile research/study_sweep_poi_ifvg_cisd.py
          python research/study_sweep_poi_ifvg_cisd.py /tmp/gold_m1.csv research/results_sweep_poi_ifvg_cisd
      - name: Commit research-only results
        run: |
          git config user.name "research-data-bot"
          git config user.email "research-data-bot@users.noreply.github.com"
          git add research/results_sweep_poi_ifvg_cisd/
          git diff --cached --quiet || (git commit -m "Save four-stage gold strategy backtest Sep-Nov 2026" && git pull --rebase && git push)
