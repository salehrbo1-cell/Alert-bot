name: XAUUSD multi-feature reversal model with August holdout
on:
  push:
    paths:
      - ".github/workflows/study-ml-reversal.yml"
      - "research/study_ml_interactions.py"
      - "research/study_reversal_confirm3.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xau-ml-reversal
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model libraries
        run: python -m pip install --quiet numpy scikit-learn
      - name: Download training M1 data (September to November)
        run: |
          npx -y dukascopy-node -i xauusd -from 2026-09-01 -to 2026-11-18 -t m1 -f csv -p bid
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path("download").rglob("*.csv"))
          if not files:raise SystemExit("Training data missing")
          shutil.copyfile(max(files,key=lambda x:x.stat().st_size),"/tmp/xau_train_m1.csv")
          PY
          rm -rf download
      - name: Download independent August retrospective holdout
        run: |
          npx -y dukascopy-node -i xauusd -from 2026-08-01 -to 2026-09-01 -t m1 -f csv -p bid
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path("download").rglob("*.csv"))
          if not files:raise SystemExit("August holdout data missing")
          shutil.copyfile(max(files,key=lambda x:x.stat().st_size),"/tmp/xau_aug_m1.csv")
          PY
      - name: Fit 40-feature models and evaluate August without tuning on it
        run: |
          python research/study_ml_interactions.py /tmp/xau_train_m1.csv /tmp/xau_aug_m1.csv research/results_ml_reversal
          python research/study_reversal_confirm3.py /tmp/xau_train_m1.csv /tmp/xau_aug_m1.csv research/results_reversal_confirm3
      - name: Commit research results
        run: |
          git config user.name "research-data-bot"
          git config user.email "research-data-bot@users.noreply.github.com"
          git add research/results_ml_reversal/ research/results_reversal_confirm3/
          git diff --cached --quiet || (git commit -m "Save 40-feature reversal model August holdout results" && git pull --rebase && git push)
