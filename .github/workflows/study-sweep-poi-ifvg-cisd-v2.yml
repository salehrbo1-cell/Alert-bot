name: Research V2 M15 CISD structural targets
on:
  push:
    paths:
      - ".github/workflows/study-sweep-poi-ifvg-cisd-v2.yml"
      - "research/study_sweep_poi_ifvg_cisd_v2.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xau-four-stage-v2
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download historical gold BID M1 with HTF warmup
        run: |
          npx -y dukascopy-node -i xauusd -from 2026-09-01 -to 2026-11-18 -t m1 -f csv -p bid
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path("download").rglob("*.csv"))
          if not files:raise SystemExit("Dukascopy M1 CSV missing")
          source=max(files,key=lambda p:p.stat().st_size)
          print("Source",source,"bytes",source.stat().st_size)
          shutil.copyfile(source,"/tmp/gold_m1.csv")
          PY
      - name: Backtest M15 CISD and liquidity-target exit
        run: |
          python -m py_compile research/study_sweep_poi_ifvg_cisd_v2.py
          python research/study_sweep_poi_ifvg_cisd_v2.py /tmp/gold_m1.csv research/results_sweep_poi_ifvg_cisd_v2
      - name: Commit research results
        run: |
          git config user.name "research-data-bot"
          git config user.email "research-data-bot@users.noreply.github.com"
          git add research/results_sweep_poi_ifvg_cisd_v2/
          git diff --cached --quiet || (git commit -m "Save M15 sweep-origin CISD structural-target backtest" && git pull --rebase && git push)
