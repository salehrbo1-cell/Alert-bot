name: XAUUSD historical resistance backtest
on:
  push:
    paths:
      - ".github/workflows/research-backtest.yml"
      - "research/backtest_resistance.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xau-research-backtest
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download 6.5 months of M15 BID candles when absent
        run: |
          if [ ! -s research/XAUUSD_M15_BID_2026-05-01_to_2026-11-17.csv ]; then
            npx -y dukascopy-node -i xauusd -from 2026-05-01 -to 2026-11-18 -t m15 -f csv -p bid
          fi
      - name: Run no-lookahead historical study
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target = Path("research/XAUUSD_M15_BID_2026-05-01_to_2026-11-17.csv")
          if not target.is_file():
              files = list(Path("download").rglob("*.csv"))
              if not files:
                  raise SystemExit("No CSV downloaded")
              source = max(files, key=lambda p: p.stat().st_size)
              shutil.copyfile(source, target)
          print(f"Using {target} ({target.stat().st_size} bytes)")
          PY
          python research/backtest_resistance.py research/XAUUSD_M15_BID_2026-05-01_to_2026-11-17.csv research/results
      - name: Save reproducible dataset and backtest outputs
        run: |
          git config user.name "research-data-bot"
          git config user.email "research-data-bot@users.noreply.github.com"
          git add research/XAUUSD_M15_BID_2026-05-01_to_2026-11-17.csv research/results/
          git diff --cached --quiet || (git commit -m "Save XAUUSD six-month resistance backtest results" && git push)
